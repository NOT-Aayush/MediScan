<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="main.css" />
  <title>PITS</title>
</head>
<body>
  <div class="sidebar">
    <button id="homeTabBtn" class="active"><i class="fas fa-home"></i> Home</button>
    <button id="outputTabBtn" style="display: none;"><i class="fas fa-chart-line"></i> Results</button>
    <button id="historyTabBtn"><i class="fas fa-history"></i> History</button>
  </div>

  <div class="app-header">
    <h2>PITS</h2>
    <div class="status-indicator" id="statusIndicator">Idle</div>
  </div>

  <div id="homeTab" class="tab active">
    <h1>PITS Image Processor</h1>
    <p>Upload and analyze MRI or CT scans with our AI-powered diagnostic tool.</p>

    <div class="analysis-tabs">
      <button id="fatTabBtn" class="active">Fat Analysis</button>
      <button id="muscleTabBtn">Muscle Analysis</button>
      <button id="submitBtn"disabled>Analyze Images</button>
    </div>

<div id="fatTab" class="analysis-tab active">
  <button id="selectFatFileBtn">Select Fat Image</button>
  <div id="fatPreviewContainer" style="display:none;">
    <img id="fatPreview" src="" alt="Selected Fat Image" />
    <div class="controls">
      <label>
        Fat Min (%) 
        <input type="range" id="fatMinSlider" min="0.01" max="1.0" step="0.01" value="0.6">
        <span id="fatMinValue">0.6</span>
      </label>
      <label>
        Fat Max (%) 
        <input type="range" id="fatMaxSlider" min="0.01" max="1.0" step="0.01" value="0.9">
        <span id="fatMaxValue">0.9</span>
      </label>
    </div>
  </div>
</div>

<div id="muscleTab" class="analysis-tab">
  <button id="selectMuscleFileBtn">Select Muscle Image</button>
  <div id="musclePreviewContainer" style="display:none;">
    <img id="musclePreview" src="" alt="Selected Muscle Image" />
    <div class="controls">
      <label>
        Muscle Min (%) 
        <input type="range" id="muscleMinSlider" min="0.01" max="1.0" step="0.01" value="0.55">
        <span id="muscleMinValue">0.55</span>
      </label>
      <label>
        Muscle Max (%) 
        <input type="range" id="muscleMaxSlider" min="0.01" max="1.0" step="0.01" value="0.85">
        <span id="muscleMaxValue">0.85</span>
      </label>
    </div>
  </div>
</div>


    <div id="loading" style="display:none;">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/>
        <path d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z">
          <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12" repeatCount="indefinite"/>
        </path>
      </svg>
      Processing your medical images...
    </div>
  </div>

  <div id="outputTab" class="tab">
    <h1>Analysis Results</h1>
    <p>Review the processed images below. Click on any image to enlarge.</p>
    <div id="outputImages"></div>
  </div>
  <div id="historyTab" class="tab">
  <h1>Saved Results</h1>
  <p>View and manage your previous analysis results.</p>
  
  <div class="results-list">
    <div class="result-item template" style="display: none;">
      <span class="result-name"></span>
      <span class="result-date"></span>
      <div class="result-actions">
        <button class="rename-btn"><i class="fas fa-edit"></i></button>
        <button class="delete-btn"><i class="fas fa-trash"></i></button>
        <button class="view-btn"><i class="fas fa-eye"></i> View</button>
      </div>
    </div>
  </div>
</div>
  <div id="toast" class="toast"></div>
  <script src="renderer.js"></script>
  <div id="imageModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImage">
<div id="editorControls" class="editor-container" style="display: none; flex-direction: column; align-items: center;">
  <canvas id="editCanvas" width="1000" height="1000" style="display: block; max-width: 90%; max-height: 70vh; border: 2px solid #ccc; margin-bottom: 15px;"></canvas>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;">
    <button id="undoBtn" class="editor-btn"><i class="fas fa-undo"></i> Undo</button>
    <button id="redoBtn" class="editor-btn"><i class="fas fa-redo"></i> Redo</button>
    <div class="tool-size" style="display: flex; align-items: center; color: white;">
      <label style="margin-right: 5px;">Size:</label>
      <input type="range" id="brushSize" min="5" max="100" value="20" style="width: 100px;">
      <span id="brushSizeValue" style="width: 30px; text-align: center;">20</span>
    </div>
    <button id="saveEditBtn" class="editor-btn"><i class="fas fa-save"></i> Save</button>
    <button id="cancelEditBtn" class="editor-btn danger"><i class="fas fa-times"></i> Cancel</button>
  </div>
</div>
</body>
</html>
